name: Publish

# 打 tag（如 v0.1.0）触发：uv build → uv publish（Trusted Publisher，免 token）
# 首次发布前需在 PyPI 配置 Trusted Publisher：
#   https://pypi.org/manage/account/publishing/ → Add a publisher (GitHub)
#   PyPI Project Name: shortcuts-toolkit, owner: <你的GitHub用户名>, repo: shortcuts-toolkit, workflow: publish.yml
on:
  push:
    tags: ["v*"]

jobs:
  build:
    name: Build dist
    runs-on: ubuntu-latest
    env:
      UV_INDEX_URL: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Build
        run: uv build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        run: uv publish
